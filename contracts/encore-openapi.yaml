openapi: 3.1.0
info:
  title: Encore
  version: 1.2.1
  description: >
    Campus event ticketing. v1.2 adds A2 Hold operations. Hold creation,
    inspection, confirmation and release are implemented. Existing
    paths and schemas retain the v1.1 contract shapes; v1.2.1 adds the 503
    response to the keyed reservation and waitlist POSTs, which use the same
    bounded abort retry as Hold commands. New Hold, waitlist and
    error responses may add fields; clients should ignore unknown fields.
    The four original event checks are preserved; full released-v1.0.0
    equivalence remains unverified. Hold validation and recovery rules are
    documented in this contract. Holds and direct booking share availability:
    Capacity minus confirmed Reservations minus live Holds.
    Missing path segments do not match these operations; router 404s are
    outside their coded-error promises. New Hold rules do not change legacy
    route-specific validation or error mappings.
servers:
  - url: http://localhost:3000

paths:
  /events:
    get:
      operationId: listEvents
      summary: List events
      description: >
        Returns events, most imminent first. Safe: calling this changes
        nothing, and callers (including caches and crawlers) may rely on that.
      parameters:
        - name: bookable
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: The list of events.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
        "422":
          description: >
            invalid_request means the bookable query parameter is not a
            boolean. Correct the request before retrying.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /events/{eventId}:
    get:
      operationId: getEvent
      summary: Fetch one event
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/EventId" }
      responses:
        "200":
          description: The event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "404":
          description: No event has this id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >
            invalid_request means the event ID does not satisfy the API
            contract. Correct the request before retrying.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /events/{eventId}/reservations:
    post:
      operationId: createReservation
      summary: Reserve one seat
      description: >
        Creates a reservation. NOT safe and not naturally idempotent, which
        is why the Idempotency-Key header is required. A repeat with the same
        global key, POST endpoint, event ID, and exact body bytes returns the
        stored first outcome without reserving another seat. The server retains
        the outcome for 24 hours after storing it, and reuse during that period
        replays it. At or after expiration, the request is processed as a new
        attempt. A timed-out caller MUST retry with the same key and unchanged
        body bytes during the retention window; a fresh key can create another
        reservation. Reusing a key for another endpoint, event, or body during
        the window returns 422.
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/EventId" }
        - name: Idempotency-Key
          in: header
          required: true
          description: >
            A unique client-generated token for this attempt (a UUID is fine).
            Keys share a global namespace across POST operations.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "201":
          description: The seat is reserved; the reservation is the receipt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "404":
          description: No event has this id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            No seats remain (error code sold_out). Retrying the same endpoint
            and event with the same key and body bytes returns this outcome;
            retrying with a new key is pointless until seats reappear.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >
            The request is unprocessable. Error codes:
            idempotency_key_required (add the header before retrying);
            idempotency_key_reuse (the key belongs to another endpoint,
            event, or body; use a new key for a new attempt);
            invalid_request (the request violates the API contract; correct
            it before retrying, and use a new idempotency key for a corrected
            request when a validation outcome was stored).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /reservations/{reservationId}:
    get:
      operationId: getReservation
      summary: Fetch one reservation
      description: >
        The recovery path: a caller that lost a reply (or its idempotency
        key) can ask what happened instead of guessing.
      parameters:
        - name: reservationId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ReservationId" }
      responses:
        "200":
          description: The reservation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "404":
          description: No reservation has this id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >
            invalid_request means the reservation ID does not satisfy the API
            contract. Correct the request before retrying.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /events/{eventId}/waitlist:
    post:
      operationId: joinWaitlist
      summary: Join an event's waitlist
      description: >
        Adds a person to a full event's waitlist. A person may have one active
        entry per event. The server retains the outcome for 24 hours after
        storing it, and reuse during that period replays it. At or after
        expiration, the request is processed as a new attempt. Repeating the
        same global key, POST endpoint, event ID, and exact body bytes during
        the retention window returns the stored first outcome, including
        errors, without creating another entry. A replayed success has its
        original position; GET returns the current position. Reusing a key for
        another endpoint, event, or body during the window returns
        idempotency_key_reuse with HTTP 422.
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/EventId"

        - name: Idempotency-Key
          in: header
          required: true
          description: >
            A unique client-generated key for this join attempt. Keys share a
            global namespace across POST operations. Retry a timed-out request
            with the same key and exact body bytes.
          schema:
            type: string
            minLength: 1

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistJoinRequest"

      responses:
        "201":
          description: >
            The waitlist entry was created. A repeat with the same key, endpoint,
            event ID, and body bytes returns the stored entry and status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntry"

        "404":
          description: >
            No event has this ID. Error code: event_not_found. A retry is not
            useful unless the event ID is corrected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

        "409":
          description: >
            event_not_full means seats are available; reserve a seat instead.
            already_on_waitlist means this person already has an active entry.
            Both outcomes are stored. The same key, endpoint, event ID, and
            body bytes replay the stored 409, even if the event later becomes
            full. A later join is a new request and needs a new key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

        "422":
          description: >
            idempotency_key_required means the header is missing.
            idempotency_key_reuse means the key belongs to another endpoint,
            event, or body; use a new key for a new attempt.
            invalid_request means the event ID is malformed, the content type
            is missing or unsupported, or the body violates the request
            contract. The body must be a JSON object containing only a
            nonempty string userId, with application/json content type.
            Correct the request rather than repeating the same invalid input.
            The validation outcome is stored and replays for the same key, so
            use a new key for the corrected request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

    get:
      operationId: listWaitlistEntries
      summary: List an event's waitlist entries
      description: >
        Returns the event's waitlist entries in first-come, first-served order.
        Positions are one-based and reflect the current order of the waitlist.
        A known event with no waitlist entries returns an empty entries array.
        This operation is safe and does not change the waitlist.
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/EventId"
      responses:
        "200":
          description: The event's ordered waitlist entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntryList"

        "404":
          description: >
            event_not_found: no event has this ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            invalid_request: the event ID does not match the EventId schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /events/{eventId}/waitlist/{entryId}:
    get:
      operationId: getWaitlistEntry
      summary: Fetch one waitlist entry
      description: >
        Returns one waitlist entry and its current one-based position in the
        event's waitlist. This operation is safe and does not change the
        waitlist.
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/EventId"
        - name: entryId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/WaitlistId"
      responses:
        "200":
          description: The waitlist entry and its current position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntry"
        "404":
          description: >
            event_not_found means no event has this ID. entry_not_found means
            the entry is unknown or belongs to another event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            invalid_request means the event ID or waitlist entry ID does not
            satisfy the API contract. Correct the IDs before retrying.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
        operationId: leaveWaitList
        summary: Leave an event's waitlist
        description: >
          Removes a waitlist entry from the specified event.
          Remaining entries move forward to preserve first-come,
          first-served order. This operation is not safe because
          it changes server state, but it is idempotent because
          repeating the deletion has no additional effect.
        parameters:
          - name: eventId
            in: path
            required: true
            schema:
              $ref: "#/components/schemas/EventId"

          - name: entryId
            in: path
            required: true
            schema:
              $ref: "#/components/schemas/WaitlistId"
        responses:
          "204":
            description: The entry was removed. No response body is returned.
          "404":
            description: >
              event_not_found means no event has this ID. entry_not_found also
              applies to an entry that has already been deleted.
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Error"

  /events/{eventId}/holds:
    post:
      operationId: createHold
      summary: Hold one available seat
      description: |
        Prefer hold-then-confirm for new clients; direct booking remains available.
        The server assigns a fixed deadline using a configurable TTL (default
        90 seconds). Reads, retries, and restart never extend it.

        Idempotency-Key is required, nonempty, case-sensitive and not trimmed.
        Whitespace-only keys are nonempty. Missing-key and key-reuse errors
        never create or replace a binding.
        Keys share the existing global POST namespace. Bind the key to this
        endpoint, event ID and exact body bytes before validating input or
        acquiring an event lock. Missing/empty key wins over every other error;
        an existing binding then replays the original status/body or returns
        422 idempotency_key_reuse on a target/body mismatch. A replay returns
        the original receipt (including held status), not current Hold state.
        Absent bytes and {} are different retry bodies. Use GET for current state.
        Expected validation and business errors are stored with the mutation
        atomically, durably for 24 hours from completion, including across
        restart. At equality or later a key may begin a new attempt. This
        window is independent of Hold expiry and indefinite resource retention.
        Content type and query are not part of the existing target/byte binding;
        a stored outcome takes precedence over their revalidation.

        For a new binding validate, in order: EventId syntax, no query
        parameters, content type/JSON/body, event existence, then availability.
        Malformed IDs return 422 invalid_request; unknown valid Event IDs
        return 404 event_not_found. Every query parameter, including duplicate
        names, is invalid_request.
        Zero body bytes are accepted regardless of Content-Type. Nonempty bytes
        require application/json (media-type parameters allowed; +json is not
        accepted) and exactly an empty JSON object. Whitespace-only, null,
        arrays, scalars, malformed JSON, and extra properties return 422
        invalid_request. The first applicable validation stage wins: invalid
        options precede event lookup, and event lookup precedes capacity.

        Retry only recognized transaction aborts with a bounded limit. Exhaustion
        returns uncached 503 service_unavailable; infrastructure failures do not
        bind a business outcome. An uncertain commit is not a confirmed rollback:
        recover with the original key, target and bytes, or GET a known Hold.
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/EventId" }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HoldCreateRequest" }
      responses:
        "201": { $ref: "#/components/responses/HoldCreated" }
        "404": { $ref: "#/components/responses/HoldEventNotFound" }
        "409": { $ref: "#/components/responses/HoldSoldOut" }
        "422": { $ref: "#/components/responses/HoldInvalidRequest" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /holds/{holdId}:
    get:
      operationId: getHold
      summary: Fetch a Hold's current effective state
      description: |
        Safe read of a retained Hold, including terminal
        Holds. Returns the current effective state, not the creation receipt.
        A Hold is live while unconfirmed, unreleased and now < expiresAt;
        equality is expired. Confirmed Holds remain confirmed after their former
        deadline. Live secondsRemaining is the positive remaining time rounded
        upward; terminal Holds return zero. No cleanup job defines expiry.
        State and time come from one coherent observation.

        Validate HoldId syntax, then reject any query parameter, then any
        nonempty body, before lookup. These return 422 invalid_request, even
        when the ID is unknown. An unknown well-formed ID returns 404
        hold_not_found. No body, options or Idempotency-Key is required. A
        supplied key is ignored; Content-Type is ignored for zero body bytes.
      parameters:
        - name: holdId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/HoldId" }
      responses:
        "200": { $ref: "#/components/responses/HoldCurrent" }
        "404": { $ref: "#/components/responses/HoldNotFound" }
        "422": { $ref: "#/components/responses/HoldInvalidOptions" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

    delete:
      operationId: releaseHold
      summary: Release a provisional allocation without deleting the Hold
      description: |
        No new key or client options are required; a supplied key is ignored.
        Validate HoldId syntax, reject any query parameter, then any nonempty
        body, before lookup (422 invalid_request). Ignore Content-Type for zero
        body bytes. Unknown well-formed Hold IDs return 404 hold_not_found.
        For a known Hold, acquire its Event lock, reread the Hold and sample
        fresh server time before the transition.

        Live held -> 204, become released. Released -> 204, no further effect.
        Expired -> 204, remain expired (expiry applies at deadline equality).
        Confirmed -> 409 already_confirmed with reservationId, including after
        its former deadline. GET that Reservation for recovery. DELETE cannot
        cancel it or restore its seat. Retain all Hold records indefinitely;
        repeat release cannot free a seat twice. No 204 response has a body.
      parameters:
        - name: holdId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/HoldId" }
      responses:
        "204": { $ref: "#/components/responses/HoldReleased" }
        "404": { $ref: "#/components/responses/HoldNotFound" }
        "409": { $ref: "#/components/responses/HoldAlreadyConfirmed" }
        "422": { $ref: "#/components/responses/HoldInvalidOptions" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /holds/{holdId}/confirm:
    post:
      operationId: confirmHold
      summary: Confirm a live Hold or recover its existing Reservation
      description: |
        No new key or client options are required; a supplied key is ignored.
        Validate HoldId syntax, reject any query parameter, then any nonempty
        body, before lookup (422 invalid_request). Ignore Content-Type for zero
        body bytes. Unknown well-formed Hold IDs return 404 hold_not_found.
        Acquire the Hold's Event lock, reread the Hold, then sample fresh
        server time immediately before the transition. Waiting past the
        deadline fails even if the request arrived earlier.

        Live held -> 201, create one separately identified linked Reservation.
        Confirmed -> 200, return that same Reservation, even after the former
        deadline; never return already_confirmed for this operation.
        Released -> 409 hold_released. Expired -> 409 hold_expired, including at
        deadline equality. Either conflict needs a new Hold and creation key.
        Confirmation replaces a live allocation, never consuming another seat.
        Semantic retries preserve final state and identity, not initial status.
      parameters:
        - name: holdId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/HoldId" }
      responses:
        "201": { $ref: "#/components/responses/HoldConfirmed" }
        "200": { $ref: "#/components/responses/HoldConfirmedAgain" }
        "404": { $ref: "#/components/responses/HoldNotFound" }
        "409": { $ref: "#/components/responses/HoldConfirmConflict" }
        "422": { $ref: "#/components/responses/HoldInvalidOptions" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

components:
  schemas:
    HoldId:
      type: string
      minLength: 37
      maxLength: 37
      pattern: "^hold_[0-9a-f]{32}$"
      description: >
        Stable opaque server-generated ID: hold_ followed by 32 lowercase hex
        characters generated using UUID4. Never infer state, event, or order
        from it. Syntactically valid does not mean the Hold exists.

    HoldCreateRequest:
      type: object
      additionalProperties: false
      description: Empty object only; the server chooses one seat and its TTL.

    HoldIdentity:
      type: object
      required: [id, eventId, createdAt, expiresAt]
      additionalProperties: true
      properties:
        id: { $ref: "#/components/schemas/HoldId" }
        eventId: { $ref: "#/components/schemas/EventId" }
        createdAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: Fixed deadline; expiry applies at equality, without cleanup.

    HoldReceipt:
      description: Immutable creation receipt; GET gives current effective state.
      allOf:
        - { $ref: "#/components/schemas/HoldIdentity" }
        - type: object
          required: [status]
          additionalProperties: true
          properties:
            status: { type: string, const: held }

    Hold:
      description: >
        Current effective state. Confirmed Holds include their separately
        identified Reservation. Additional response fields are allowed.
      allOf:
        - { $ref: "#/components/schemas/HoldIdentity" }
        - type: object
          required: [status, secondsRemaining]
          additionalProperties: true
          properties:
            status: { type: string, enum: [held, confirmed, released, expired] }
            secondsRemaining: { type: integer, minimum: 0 }
            reservationId: { $ref: "#/components/schemas/ReservationId" }
          if:
            properties:
              status: { const: confirmed }
          then:
            required: [reservationId]
        - if:
            properties:
              status: { const: held }
          then:
            properties:
              secondsRemaining: { minimum: 1 }
          else:
            properties:
              secondsRemaining: { const: 0 }

    ConfirmedHoldError:
      allOf:
        - { $ref: "#/components/schemas/Error" }
        - type: object
          required: [reservationId]
          additionalProperties: true
          properties:
            error: { const: already_confirmed }
            reservationId: { $ref: "#/components/schemas/ReservationId" }

    EventId:
      type: string
      pattern: "^ev_[0-9]+$"

    ReservationId:
      type: string
      pattern: "^res_[0-9]+$"

    WaitlistId:
      type: string
      pattern: "^wl_[A-Za-z0-9]+$"

    Event:
      type: object
      required: [id, title, seatsLeft]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/EventId" }
        title: { type: string, minLength: 1, maxLength: 200 }
        seatsLeft:
          type: integer
          minimum: 0
          description: >
            Seats not yet reserved. Zero means the event is full. This field
            is a point-in-time observation, not a promise; it may be stale by
            the time a reservation is attempted.

    Reservation:
      type: object
      required: [id, eventId, status, createdAt]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/ReservationId" }
        eventId: { $ref: "#/components/schemas/EventId" }
        status:
          type: string
          enum: [confirmed, cancelled, checked_in]
        createdAt:
          type: string
          format: date-time

    WaitlistJoinRequest:
      type: object
      required: [ userId ]
      additionalProperties: false
      properties:
        userId:
          type: string
          minLength: 1
          description: Stable identifier of the person joining the waitlist.

    WaitlistEntry:
      type: object
      required: [ id, eventId, position, createdAt ]
      additionalProperties: true
      description: >
        A replayed POST returns the position from its stored outcome. GET
        responses return the entry's current position.
      properties:
        id: { $ref: "#/components/schemas/WaitlistId" }
        eventId: { $ref: "#/components/schemas/EventId" }
        position:
          type: integer
          minimum: 1
          description: One-based position in the event's waitlist.
        createdAt:
          type: string
          format: date-time

    WaitlistEntryList:
      type: object
      required: [ entries ]
      additionalProperties: true
      properties:
        entries:
          type: array
          description: Waitlist entries in first-come, first-served order.
          items:
            $ref: "#/components/schemas/WaitlistEntry"

    Error:
      type: object
      required: [error]
      additionalProperties: true
      description: |
        The `error` field contains a stable machine-readable code. Waitlist codes:
        - `event_not_found` (404): the event ID is unknown. Correct the ID before retrying.
        - `event_not_full` (409): seats are available. Reserve a seat; do not retry this join.
        - `already_on_waitlist` (409): the person already has an active entry. Do not rejoin while it is active.
        - `idempotency_key_required` (422): the header is missing. Add a key before retrying.
        - `idempotency_key_reuse` (422): the key belongs to another endpoint, event, or body bytes. Use a new key for a new attempt.
        - `invalid_request` (422): a malformed path or query parameter, missing or unsupported content type, or invalid body violates the operation's request contract. Correct the request; repeating the same invalid input will not help. If a POST validation outcome was stored, use a new key for the corrected request.
        - `entry_not_found` (404): the entry ID is unknown or belongs to another event. Correct the ID before retrying.

        Unrecognized codes are non-retryable.
      properties:
        error:
          type: string
          description: A stable machine-readable error code, never prose.

  responses:
    HoldConfirmed:
      description: >
        201 first confirmation; the separately identified Reservation has
        status confirmed. Its ID is linked from the retained Hold.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Reservation" }

    HoldConfirmedAgain:
      description: >
        200 repeated confirmation returns the same confirmed Reservation.
        No new Reservation or capacity change occurs.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Reservation" }

    HoldReleased:
      description: >
        204 without a body. Live held becomes released; already released stays
        released; expired stays expired. The Hold remains addressable.

    HoldConfirmConflict:
      description: >
        409 hold_expired or hold_released. Create a new Hold using a new
        creation key; this Hold cannot be renewed or confirmed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            expired: { value: { error: hold_expired } }
            released: { value: { error: hold_released } }

    HoldAlreadyConfirmed:
      description: >
        409 already_confirmed, DELETE only. Retrieve GET
        /reservations/{reservationId} using the returned reservationId.
        Releasing a confirmed Hold cannot cancel its Reservation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ConfirmedHoldError" }
          example: { error: already_confirmed, reservationId: res_1 }

    HoldCurrent:
      description: >
        200 current Hold. GET never renews the deadline, changes state, or
        persists an expiry marker. reservationId is required when confirmed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Hold" }

    HoldNotFound:
      description: >
        404 hold_not_found for an unknown well-formed Hold ID. Correct the ID
        before retrying; terminal Holds are retained and remain addressable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: hold_not_found }

    HoldInvalidOptions:
      description: >
        422 invalid_request for a malformed Hold ID, any query parameter or
        any nonempty body (including {}). Correct the input before retrying.
        No key is needed and no replay binding is consulted or written.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: invalid_request }

    HoldCreated:
      description: >
        201 original receipt. Same-key replay preserves this status/body even
        after confirmation, release or expiry; GET supplies the current view.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/HoldReceipt" }
          examples:
            created:
              value:
                id: hold_1234567890ab4def81234567890abcde
                eventId: ev_103
                status: held
                createdAt: "2026-11-08T20:00:00Z"
                expiresAt: "2026-11-08T20:01:30Z"

    HoldEventNotFound:
      description: >
        404 event_not_found for an unknown well-formed Event ID. Correct the
        ID and use a new key if the original outcome was stored.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: event_not_found }

    HoldSoldOut:
      description: >
        409 sold_out. Confirmed Reservations plus live Holds fill Capacity.
        Same-key retries replay this stored error even after capacity returns.
        Do not immediately retry unchanged; a later attempt uses a new key
        while the original binding remains valid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: sold_out }

    HoldInvalidRequest:
      description: >
        422 idempotency_key_required: add the missing/empty creation key.
        idempotency_key_reuse: use a new key for a different target/body.
        Neither response creates or replaces a binding.
        invalid_request: correct the malformed ID, query, content type or body;
        a stored validation outcome requires a new key for corrected input.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            missingKey: { value: { error: idempotency_key_required } }
            reusedKey: { value: { error: idempotency_key_reuse } }
            invalidInput: { value: { error: invalid_request } }

    ServiceUnavailable:
      description: >
        503 service_unavailable after bounded recognized-abort retry exhaustion.
        Never cached as a business outcome. Retry creation with the original
        key, target and exact bytes. For confirm/release, GET then use semantic
        retry. Lost commit acknowledgement does not prove rollback; a committed
        prior outcome, if present, remains recoverable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: service_unavailable }
